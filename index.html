<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="version" content="3">
  <meta name="theme-color" content="#000000">
  <title>Nébula 💗</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mundo.css">
</head>
<body data-m="neutral">

  <div id="screen">
    <div id="face">
      <div id="eyes">
        <div class="eye l"></div>
        <div class="eye r"></div>
        <i class="bl a"></i>
        <i class="bl b"></i>
        <b id="sym">💢</b>
        <b id="acc"></b>
      </div>
      <div id="mouth"></div>
    </div>
  </div>

  <div id="bubble"></div>
  <div id="panel"></div>
  <div id="estado"></div>

  <div id="bar">
    <button id="bXarope" style="display:none">🍯 Xarope</button>
    <button id="bEstado">💗 Estado</button>
    <button id="bCuidar">🧸 Cuidar</button>
    <button id="bBrincar">🎮 Brincar</button>
    <button id="bCasa">🏠 Casa</button>
    <button id="bMundo">✨ Mundo</button>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- 1. Dados -->
  <script src="js/data.js"></script>

  <!-- 2. Core -->
  <script src="js/core/utils.js"></script>
  <script src="js/core/som.js"></script>
  <script src="js/core/estado.js"></script>
  <script src="js/core/personalidade.js"></script>
  <script src="js/core/rosto.js"></script>
  <script src="js/core/sensores.js"></script>
  <script src="js/core/toque.js"></script>
  <script src="js/core/tedio.js"></script>

  <!-- 3. Firebase (a lógica) -->
  <script src="js/firebase.js"></script>

  <!-- 4. Features -->
  <script src="js/features/comida.js"></script>
  <script src="js/features/doenca.js"></script>
  <script src="js/features/danca.js"></script>
  <script src="js/features/minigames.js"></script>
  <script src="js/features/mundo.js"></script>
  <script src="js/features/cidade.js"></script>
  <script src="js/features/mercado.js"></script>
  <script src="js/features/spa.js"></script>
  <script src="js/features/doceria.js"></script>
  <script src="js/features/biblioteca.js"></script>
  <script src="js/features/boutique.js"></script>
  <script src="js/features/casa.js"></script>

  <!-- 5. UI e Início -->
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
