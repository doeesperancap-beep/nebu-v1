<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="version" content="4">
  <meta name="theme-color" content="#000000">
  <title>Nébula 💗</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mundo.css">
</head>
<body data-m="neutral">

  <div id="screen">
    <div id="face">
      <div id="eyes">
        <div class="eye l"></div>
        <div class="eye r"></div>
        <i class="bl a"></i>
        <i class="bl b"></i>
        <b id="sym">💢</b>
        <b id="acc"></b>
      </div>
      <div id="mouth"></div>
    </div>
  </div>

  <div id="bubble"></div>
  <div id="panel"></div>
  <div id="estado"></div>

  <div id="bar">
    <button id="bXarope" style="display:none">🍯 Xarope</button>
    <button id="bEstado">💗 Estado</button>
    <button id="bCuidar">🧸 Cuidar</button>
    <button id="bBrincar">🎮 Brincar</button>
    <button id="bCasa">🏠 Casa</button>
    <button id="bMundo">✨ Mundo</button>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- 1. Dados (FIREBASE_CONFIG, listas, receitas, livros) -->
  <script src="1-dados.js"></script>

  <!-- 2. Utilidades (SOM, $, N) -->
  <script src="2-utilitarios.js"></script>

  <!-- 3. Estado (S, save, decay) -->
  <script src="3-estado.js"></script>

  <!-- 4. Personalidade -->
  <script src="4-personalidade.js"></script>

  <!-- 5. Rosto (say, set, mood) -->
  <script src="5-rosto.js"></script>

  <!-- 6. Sensores -->
  <script src="6-sensores.js"></script>

  <!-- 7. Toque (pointerdown, etc) -->
  <script src="7-toque.js"></script>

  <!-- 8. Comida e Doença -->
  <script src="8-comida.js"></script>

  <!-- 9. Minigames e Dança -->
  <script src="9-minigames.js"></script>

  <!-- 10. Mundo e Cidade -->
  <script src="10-mundo.js"></script>

  <!-- 11. Lugares (Spa, Mercado, Doceria, Biblioteca, Boutique, Casa) -->
  <script src="11-lugares.js"></script>

  <!-- 12. Interface (Painéis e Botões) -->
  <script src="12-ui.js"></script>

  <!-- 13. Loop Principal e Aviso -->
  <script src="13-main.js"></script>

  <!-- 14. Firebase Lógica (Salvar, Ler, Recorde) -->
  <script src="14-firebase.js"></script>

</body>
</html>
