<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="version" content="4">
  <meta name="theme-color" content="#000000">
  <title>Nébula 💗</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mundo.css">
</head>
<body data-m="neutral">

  <div id="screen">
    <div id="face">
      <div id="eyes">
        <div class="eye l"></div>
        <div class="eye r"></div>
        <i class="bl a"></i>
        <i class="bl b"></i>
        <b id="sym">💢</b>
        <b id="acc"></b>
      </div>
      <div id="mouth"></div>
    </div>
  </div>

  <div id="bubble"></div>
  <div id="panel"></div>
  <div id="estado"></div>

  <div id="bar">
    <button id="bXarope" style="display:none">🍯 Xarope</button>
    <button id="bEstado">💗 Estado</button>
    <button id="bCuidar">🧸 Cuidar</button>
    <button id="bBrincar">🎮 Brincar</button>
    <button id="bCasa">🏠 Casa</button>
    <button id="bMundo">✨ Mundo</button>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- 1. Dados (Puxando da pasta js/) -->
  <script src="js/dados.js"></script>

  <!-- 2. Utilitários -->
  <script src="js/utilitarios.js"></script>

  <!-- 3. Estado -->
  <script src="js/estado.js"></script>

  <!-- 4. Personalidade -->
  <script src="js/personalidade.js"></script>

  <!-- 5. Rosto -->
  <script src="js/rosto.js"></script>

  <!-- 6. Sensores -->
  <script src="js/sensores.js"></script>

  <!-- 7. Toque -->
  <script src="js/toque.js"></script>

  <!-- 8. Comida -->
  <script src="js/comida.js"></script>

  <!-- 9. Minigames -->
  <script src="js/minigames.js"></script>

  <!-- 10. Mundo -->
  <script src="js/mundo.js"></script>

  <!-- 11. Lugares -->
  <script src="js/lugares.js"></script>

  <!-- 12. UI -->
  <script src="js/ui.js"></script>

  <!-- 13. Main -->
  <script src="js/main.js"></script>

  <!-- 14. Firebase -->
  <script src="js/firebase.js"></script>

</body>
</html>
